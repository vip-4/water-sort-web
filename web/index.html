      <p>Pour colored water between tubes until each tube holds a single color. This game has infinite procedurally generated levels, works offline, and contains no ads or tracking. JavaScript is required to run the game in your browser.</p>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the HTML loading overlay once Flutter has painted its first frame.
    // The overlay must never intercept taps meant for the game canvas.
    (function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      var tries = 0;
      var timer = setInterval(function () {
        var pane = document.querySelector('flt-glass-pane');
        var canvas = pane && pane.shadowRoot && pane.shadowRoot.querySelector('canvas');
        if (canvas || ++tries > 150) {
          loading.remove();
          clearInterval(timer);
        }
      }, 100);
    })();
  </script>
</body>
